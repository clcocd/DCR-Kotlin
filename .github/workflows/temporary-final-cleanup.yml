name: One-time final branch cleanup
on:
  push:
    paths:
      - .github/workflows/temporary-final-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed and merged work branches
        uses: actions/github-script@v7
        with:
          script: |
            const names = ["feat/kotlin-6.2.2-port","feat/kotlin-preview-state","fix/kotlin-dccon-wheel-capture"];
            for (const name of names) {
              await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${name}`});
              core.info(`Deleted ${name}`);
            }
