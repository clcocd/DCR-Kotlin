name: Targeted settings removal audit
on:
  push:
    branches: [chore/remove-unused-settings]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate all three feature references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pat=re.compile(r'tooltipMode|tooltipMediaHide|tooltipDelay|tooltipInteraction|reversePreviewKey|longPressDelay|toggleAdminPanel|blockPreset|miniPosition|miniWidth|miniHeight|closeMiniSoon|keepMini|hoverMini|moveMini|MiniState|MiniPreview|mini-preview|preview/mini|manageModule|manage\\b|adminVisible|requestManage|MANAGE_LABELS|blockPreset',re.I)
          for root in ['features','kotlin/src/jsMain','entrypoints','core','stores','components','tests','e2e']:
            for f in sorted(Path(root).rglob('*')):
              if not f.is_file() or f.suffix not in ('.kt','.ts','.tsx','.css'): continue
              lines=f.read_text(errors='replace').splitlines()
              matches=[(i+1,line.strip()) for i,line in enumerate(lines) if pat.search(line)]
              if matches:
                print(f'FILE {f} MATCHES {len(matches)}')
                for i,line in matches[:22]: print(f'  {i}: {line[:220]}')
          PY
