name: One-time merged branch cleanup
on:
  push:
    paths:
      - .github/workflows/temporary-branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete precisely selected merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const names = ["audit/6-2-2-parity","ci/build-without-zip","docs/final-patch-decisions","docs/record-legacy-patch","feat/kotlin-block-normalization","feat/kotlin-comment-core","feat/kotlin-dom-appearance","feat/kotlin-double-press","feat/kotlin-fonts-feature","feat/kotlin-imagesearch-background","feat/kotlin-keyboard-shortcuts","feat/kotlin-layout-feature","feat/kotlin-manage-module","feat/kotlin-module-definition","feat/kotlin-module-settings","feat/kotlin-runtime-bridge","feat/kotlin-search-writer","feat/kotlin-stealth-fonts-module","feat/kotlin-text-decoder-block","feat/kotlin-user-response","feat/kotlin-write-module","test/kotlin-wxt-build"];
            for (const name of names) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`
                });
                core.info(`Deleted ${name}`);
              } catch (error) {
                core.setFailed(`Failed deleting ${name}: ${error.message}`);
                return;
              }
            }
