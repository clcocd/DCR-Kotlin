name: Kotlin + WXT 확장 빌드

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: 2단계 TypeScript 런타임 연결부 목록
        run: node scripts/audit-kotlin-boundary.mjs

      - name: Kotlin/JS 단위 테스트
        run: ./gradlew --no-daemon :kotlin:jsNodeTest

      - name: TypeScript 타입 검사
        run: bun run compile

      - name: Vitest 단위 테스트
        run: bun run test

      - name: Chrome MV3 확장 빌드
        run: bun run build

      - name: Firefox MV3 확장 빌드
        run: bun run build:firefox

      - name: Chromium 테스트 브라우저 설치
        run: bunx playwright install --with-deps chromium

      - name: Chrome 확장 E2E — 순정 기준선 5건과 비교
        shell: bash
        run: |
          set +e
          bunx playwright test --project=chromium --reporter=json > "$RUNNER_TEMP/chromium-e2e.json"
          test_exit=$?
          set -e
          test -s "$RUNNER_TEMP/chromium-e2e.json"
          node scripts/verify-e2e-baseline.mjs "$RUNNER_TEMP/chromium-e2e.json"
          # 신규 실패 여부는 위 검증기가 판정한다. 기존 5건은 경고로 보고한다.
          if [[ $test_exit -ne 0 ]]; then
            echo "::notice::Playwright 자체는 실패했습니다. 위 요약에서 순정 실패인지 신규 실패인지 분리했습니다."
          fi

      - name: Firefox 테스트 브라우저 설치
        run: bunx playwright install --with-deps firefox

      - name: Firefox 미리보기 요청 취소 E2E — AbortError 회귀
        run: bunx playwright test e2e/preview.spec.ts --project=firefox --grep "받는 중에 넘기거나 닫아 끊은 요청은 콘솔에 오류를 남기지 않는다"

      - name: Firefox 전체 콘텐츠 E2E — 최초 기준선과 비교
        shell: bash
        run: |
          set +e
          bunx playwright test --project=firefox --workers=2 --reporter=json > "$RUNNER_TEMP/firefox-e2e.json"
          test_exit=$?
          set -e
          test -s "$RUNNER_TEMP/firefox-e2e.json"
          node scripts/verify-e2e-baseline.mjs "$RUNNER_TEMP/firefox-e2e.json" firefox
          if [[ $test_exit -ne 0 ]]; then
            echo "::notice::Firefox Playwright 자체는 실패했습니다. 최초 기준선과 비교한 위 검증 결과를 확인하세요."
          fi

      - name: 실제 디시 읽기 전용 E2E — 6.2.2 동작·마크업 검사
        run: bunx playwright test e2e/live/dcinside.spec.ts --project=live --workers=1

      - name: Kotlin 포함 여부와 Manifest 검증
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/dcr-kotlin.mjs
          for browser in chrome firefox; do
            directory=".output/$browser-mv3"
            test -s "$directory/manifest.json"
            test -s "$directory/page-runtime.js"
            grep -R -F -q '__DCR_KOTLIN__' "$directory"
          done
