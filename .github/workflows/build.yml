name: Kotlin + WXT 확장 빌드

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Kotlin/JS 테스트 및 브라우저 번들 생성
        run: gradle --no-daemon -p kotlin jsNodeTest jsBrowserDistribution

      - name: Kotlin 번들을 WXT 소스 모듈로 연결
        shell: bash
        run: |
          set -euo pipefail
          find kotlin/build -type f -name 'dcr-kotlin.js' -print
          bundle=$(find kotlin/build -type f -path '*/productionExecutable/dcr-kotlin.js' -print -quit)
          test -n "$bundle"
          mkdir -p generated
          cp "$bundle" generated/kotlin-bridge.js

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: oven-sh/setup-bun@v2

      - name: WXT 의존성 설치
        run: bun ci

      - name: 원본 TypeScript 검사
        run: bun run compile

      - name: 원본 단위 테스트
        run: bun run test

      - name: Chrome MV3 확장 빌드
        run: bun run build

      - name: Chromium 테스트 브라우저 설치
        run: bunx playwright install --with-deps chromium

      - name: Chrome 확장 실제 실행 E2E (가짜 디시 페이지)
        run: bunx playwright test --project=chromium

      - name: Kotlin 포함 여부와 Manifest 검증
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/kotlin-bridge.js
          test -s .output/chrome-mv3/manifest.json
          # Kotlin API가 WXT의 실행 번들에 실제로 포함됐는지 검증한다.
          grep -R -F -q '__DCR_KOTLIN__' .output/chrome-mv3
