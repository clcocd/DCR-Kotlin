name: Stage 2 browser parity verification
on:
  push:
    branches: [verify/stage2-browser-parity]
permissions:
  contents: read
jobs:
  firefox:
    name: Firefox fixture E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Firefox extension
        run: bun run build:firefox
      - name: Install Playwright Firefox
        run: bunx playwright install --with-deps firefox
      - name: Firefox fixture E2E
        run: bunx playwright test --project=firefox --reporter=list
  live:
    name: Live read-only Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Chrome extension
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Live read-only tests (write requests blocked by fixture)
        run: bunx playwright test --project=live --workers=1 --reporter=list
