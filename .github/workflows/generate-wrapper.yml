name: Generate Gradle wrapper (one-time)
on:
  push:
    branches: [refactor/kotlin-project-structure]
permissions:
  contents: write
jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Generate wrapper and commit generated binary
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: Gradle 8.14.3 Wrapper 추가'
            git push origin HEAD:refactor/kotlin-project-structure
          fi
