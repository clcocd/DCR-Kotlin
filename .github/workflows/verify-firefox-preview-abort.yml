name: Verify Firefox preview abort fix
on:
  push:
    branches: [verify/firefox-preview-abort-fix]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Firefox
        run: bun run build:firefox
      - name: Install Firefox browser
        run: bunx playwright install --with-deps firefox
      - name: Verify canceling preview never logs AbortError
        run: bunx playwright test --project=firefox --grep="받는 중에 넘기거나 닫아 끊은 요청은 콘솔에 오류를 남기지 않는다" --repeat-each=5 --workers=2 --reporter=list
