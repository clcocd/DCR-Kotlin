name: Verify Firefox preview abort fix
on:
  push:
    branches: [verify/firefox-preview-abort-fix]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build Firefox
        run: bun run build:firefox
      - name: Install Firefox browser
        run: bunx playwright install --with-deps firefox
      - name: Full Firefox fixture E2E vs original 6.2.2
        run: bunx playwright test --project=firefox --reporter=list
