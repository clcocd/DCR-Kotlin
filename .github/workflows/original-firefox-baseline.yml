name: 6.2.2 원본 Firefox 동등성 기준선

on:
  push:
    branches: [verify/original-firefox-parity-622]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-firefox:
    if: github.event_name == 'push' || github.head_ref == 'verify/original-firefox-parity-622'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/original-6-2-2-e2e-baseline
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: 순정 6.2.2 의존성 설치
        run: bun ci

      - name: 순정 6.2.2 Firefox 확장 빌드
        run: bun run build:firefox

      - name: Firefox 브라우저 설치
        run: bunx playwright install --with-deps firefox

      - name: 순정 6.2.2 Firefox 전체 E2E 실행
        shell: bash
        run: |
          set +e
          bunx playwright test --project=firefox --workers=2 --reporter=json > original-firefox.json
          test_exit=$?
          set -e
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("original-firefox.json","utf8"));const s=r.stats??{};console.log("Original 6.2.2 Firefox:",JSON.stringify(s));if(!r.suites?.length)process.exit(1)'
          echo "::notice::순정 Firefox Playwright 종료 상태: $test_exit (기존 오류는 원본 기준선에 포함해 기록)"

      - uses: actions/upload-artifact@v4
        with:
          name: original-6-2-2-firefox
          path: original-firefox.json
